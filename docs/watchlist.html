<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Watchlist // Sniper Neobus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .neobus-header { background: linear-gradient(135deg, #a80f20 0%, #c01427 50%, #870b18 100%); }
    .slot-pill.active {
      background-color: #c01427 !important;
      color: #ffffff !important;
      border-color: #991b1b !important;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 p-3 md:p-6 max-w-6xl mx-auto min-h-screen">

  <!-- Header -->
  <header class="neobus-header rounded-2xl p-5 mb-6 text-white shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-white px-3.5 py-1.5 rounded-xl shadow-md select-none">
        <span class="text-xl font-black text-slate-950">NEO<span class="text-[#c01427]">BUS</span></span>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight">SENTINEL // CENTRUM OBSERWACJI</h1>
        <p class="text-red-100 text-xs">Automatyczny snajper cenowy & alerty Discord</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="configureToken()" class="px-3 py-1.5 rounded-lg bg-black/30 hover:bg-black/50 border border-white/20 text-xs font-semibold cursor-pointer">🔑 Konfiguruj Token GitHub</button>
      <a href="./index.html" class="px-3 py-1.5 rounded-lg bg-white text-[#c01427] text-xs font-bold shadow hover:bg-slate-100">← Wróć do Radaru</a>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Lewa Kolumna: Konfigurator połączenia -->
    <div class="lg:col-span-1 bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">1. Skonfiguruj cel</h2>
      
      <div>
        <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">Skąd (Odjazd)</label>
        <select id="selFrom" onchange="renderHourSlots()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="">-- Wybierz przystanek początkowy --</option>
        </select>
      </div>

      <div class="flex justify-center">
        <button onclick="swapStations()" class="p-2 rounded-full border border-slate-300 dark:border-slate-700 text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition font-bold cursor-pointer">⇄ Odwróć kierunek</button>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">Dokąd (Przyjazd)</label>
        <select id="selTo" onchange="renderHourSlots()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="">-- Wybierz przystanek docelowy --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">Data kursu</label>
        <input type="date" id="selDate" onchange="renderHourSlots()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Szybki wybór godzin kursu -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-600 dark:text-slate-300">Wybierz godziny odjazdu</label>
          <span class="text-[10px] text-slate-400">kliknij aby zaznaczyć</span>
        </div>
        <div id="slotsContainer" class="p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl flex flex-wrap gap-1.5 items-center justify-start">
          <!-- Kafelki godzin wstrzykiwane przez JS -->
        </div>
        <div class="mt-2 flex items-center gap-2">
          <input type="text" id="customHour" placeholder="Inna godzina (np. 14:15)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-xs font-mono">
          <button onclick="addCustomHour()" class="px-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-xs font-bold rounded-lg shrink-0">Dodaj</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">Próg alertu miejsc (fotele &le;)</label>
        <input type="number" id="selThreshold" value="5" min="1" max="30" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <button onclick="addTarget()" id="btnAddTarget" class="w-full py-3 bg-[#c01427] hover:bg-[#a80f20] text-white font-bold rounded-xl shadow transition text-xs flex items-center justify-center gap-2 cursor-pointer">
        <span>🎯 Dodaj do obserwowanych</span>
      </button>
    </div>

    <!-- Prawa Kolumna: Lista Obserwowanych -->
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
          <div>
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">Aktywnie obserwowane kursy</h2>
            <p class="text-xs text-slate-400">Bot sprawdza ceny i wyśle alert na Discord w razie spadku lub braku foteli.</p>
          </div>
          <span id="targetCount" class="text-xs font-bold px-2.5 py-1 rounded-md bg-red-100 dark:bg-red-950 text-[#c01427] dark:text-red-400">0 zadań</span>
        </div>

        <div id="targetsList" class="space-y-2.5">
          <div class="text-xs text-slate-400 py-6 text-center">Wczytywanie listy z repozytorium...</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const REPO_OWNER = "gkakol";
    const REPO_NAME = "Hermes";
    let fileSha = null;
    let watchlistData = { targets: [], archived_targets: [] };
    let selectedHours = new Set();

    // Typowe godziny Neobusa na linii N3 / N1
    const DEFAULT_HOURS = ["03:00", "04:20", "06:35", "07:45", "10:10", "12:00", "15:35", "17:40", "22:25", "23:10", "23:50"];

    const STATIONS = [
      { id: "49", name: "BABICA Kolonia" },
      { id: "46", name: "BLIZNE" },
      { id: "36", name: "BOGUCHWAŁA ODR" },
      { id: "44", name: "BRZOZÓW Dworzec PKS Plac Grunwaldzki 01" },
      { id: "84", name: "BUSKO- ZDRÓJ MDA ul. Waryńskiego 29" },
      { id: "47", name: "DOMARADZ" },
      { id: "123", name: "GLIWICE Centrum Przesiadkowe ul. Składowa 8a" },
      { id: "38", name: "GRABOWNICA" },
      { id: "43", name: "HUMNISKA" },
      { id: "21", name: "IWONICZ Zdrój" },
      { id: "124", name: "IŁŻA D.A. ul. Podzamcze 33" },
      { id: "94", name: "JAROSŁAW Centr. Przes. PKP" },
      { id: "73", name: "KATOWICE D.A. ul. Sądowa 5" },
      { id: "85", name: "KIELCE DA ul. Czarnowska 12" },
      { id: "23", name: "KOLBUSZOWA Dw. PKS" },
      { id: "72", name: "KRAKÓW Lotnisko Balice" },
      { id: "71", name: "KRAKÓW MDA" },
      { id: "22", name: "KROSNO D.A.st. 4" },
      { id: "66", name: "LESKO D.A. ul. Piłsudskiego 50" },
      { id: "48", name: "LUTCZA skrz." },
      { id: "96", name: "MEDYKA Granica" },
      { id: "37", name: "MIEJSCE PIASTOWE" },
      { id: "81", name: "MIELEC D.A. ul Jagiellończyka" },
      { id: "19", name: "NIEBYLEC" },
      { id: "25", name: "NOWA DĘBA" },
      { id: "35", name: "OPATÓW D.A. ul. Sienkiewicza 19" },
      { id: "78", name: "OSTROWIEC Św. D.A." },
      { id: "92", name: "PIOTRKÓW TRYB. DA ul.P.O.W. 12" },
      { id: "62", name: "POLAŃCZYK" },
      { id: "63", name: "POLAŃCZYK skrz." },
      { id: "82", name: "POŁANIEC D.A. (Galeria Połaniecka)" },
      { id: "95", name: "PRZEMYŚL Dw.PKS" },
      { id: "54", name: "RADOM Słowackiego/Idalińska" },
      { id: "55", name: "RADOM Warszawska (rondo)" },
      { id: "24", name: "RYMANÓW Rynek" },
      { id: "29", name: "RYMANÓW Zdrój Góra" },
      { id: "40", name: "RYMANÓW Zdrój pocz.PKS" },
      { id: "76", name: "RZESZÓW D.A. PKS" },
      { id: "17", name: "SANOK D.A. Lipińskiego" },
      { id: "41", name: "SANOK ul. Dmowskiego/Staszica ALFA" },
      { id: "42", name: "SANOK ul. Krakowska , Dąbrówka" },
      { id: "64", name: "SOLINA" },
      { id: "39", name: "STARA WIEŚ," },
      { id: "83", name: "STASZÓW Rynek 01/02" },
      { id: "79", name: "TARNOBRZEG D.A." },
      { id: "75", name: "WARSZAWA Dw. Zach. st.7" },
      { id: "28", name: "WARSZAWA Lotn. Chopina" },
      { id: "77", name: "WROCŁAW PKS Polbus" },
      { id: "68", name: "ZAGÓRZ osiedle" },
      { id: "115", name: "ŻARNÓW Pl.Piłsudskiego/Rynek" },
      { id: "93", name: "ŁÓDŹ FABRYCZNA WPA" },
      { id: "88", name: "ŁÓDŹ KALISKA Włókniarzy/Karolewska" },
      { id: "53", name: "ŁONIÓW" }
    ];

    function initStationSelects() {
      const sorted = [...STATIONS].sort((a, b) => a.name.localeCompare(b.name, 'pl'));
      const sFrom = document.getElementById('selFrom');
      const sTo = document.getElementById('selTo');

      sorted.forEach(st => {
        sFrom.add(new Option(st.name, st.id));
        sTo.add(new Option(st.name, st.id));
      });
      renderHourSlots();
    }

    function renderHourSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      DEFAULT_HOURS.forEach(h => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `slot-pill px-2.5 py-1 rounded-lg border text-xs font-mono font-bold transition cursor-pointer ${
          selectedHours.has(h)
            ? 'active bg-[#c01427] text-white border-red-800'
            : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-700 hover:border-red-500'
        }`;
        btn.innerText = h;
        btn.onclick = () => {
          if (selectedHours.has(h)) {
            selectedHours.delete(h);
            btn.classList.remove('active', 'bg-[#c01427]', 'text-white');
          } else {
            selectedHours.add(h);
            btn.classList.add('active', 'bg-[#c01427]', 'text-white');
          }
        };
        container.appendChild(btn);
      });
    }

    function addCustomHour() {
      const input = document.getElementById('customHour');
      const val = input.value.trim();
      if (!/^\d{2}:\d{2}$/.test(val)) {
        alert("Podaj godzinę w formacie GG:MM (np. 18:30)!");
        return;
      }
      selectedHours.add(val);
      if (!DEFAULT_HOURS.includes(val)) {
        DEFAULT_HOURS.push(val);
        DEFAULT_HOURS.sort();
      }
      input.value = '';
      renderHourSlots();
    }

    function swapStations() {
      const f = document.getElementById('selFrom').value;
      const t = document.getElementById('selTo').value;
      document.getElementById('selFrom').value = t;
      document.getElementById('selTo').value = f;
      renderHourSlots();
    }

    function configureToken() {
      const current = localStorage.getItem('sentinel_gh_token') || '';
      const token = prompt("Podaj GitHub Personal Access Token (uprawnienia: Contents: Read & Write):", current);
      if (token !== null) {
        localStorage.setItem('sentinel_gh_token', token.trim());
        alert("Token zapisany w przeglądarce!");
        loadWatchlist();
      }
    }

    async function loadWatchlist() {
      const listEl = document.getElementById('targetsList');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/watchlist.json?ref=main`, {
          headers: localStorage.getItem('sentinel_gh_token') ? { 'Authorization': `token ${localStorage.getItem('sentinel_gh_token')}` } : {}
        });
        if (!res.ok) throw new Error("Błąd odczytu watchlist.json");
        const jsonRes = await res.json();
        fileSha = jsonRes.sha;
        watchlistData = JSON.parse(decodeURIComponent(escape(atob(jsonRes.content))));
        renderTargets();
      } catch (e) {
        listEl.innerHTML = `<div class="text-xs text-amber-500 py-4 text-center">Brak pliku watchlist.json lub brak autoryzacji tokenem.</div>`;
      }
    }

    function renderTargets() {
      const listEl = document.getElementById('targetsList');
      document.getElementById('targetCount').innerText = `${watchlistData.targets.length} zadań`;

      if (!watchlistData.targets.length) {
        listEl.innerHTML = `<div class="text-xs text-slate-400 py-8 text-center">Brak aktywnych obserwacji. Skonfiguruj kurs po lewej stronie.</div>`;
        return;
      }

      listEl.innerHTML = watchlistData.targets.map((t, idx) => `
        <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
          <div>
            <div class="text-xs font-bold text-slate-800 dark:text-slate-200">${t.from_name} ➔ ${t.to_name}</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
              📅 <span class="font-bold text-slate-700 dark:text-slate-300">${t.date}</span> o <span class="font-mono font-bold">${t.hour}</span> • Alert miejsc: &le;${t.seat_threshold}
            </div>
            <div class="text-[10px] text-emerald-600 font-semibold mt-0.5">
              Ostatnia cena: ${t.current_price ? t.current_price.toFixed(2) + ' zł' : 'Oczekuje na skan bota'}
            </div>
          </div>
          <button onclick="removeTarget(${idx})" class="text-xs text-rose-500 hover:text-rose-700 font-bold px-2 py-1 rounded bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 cursor-pointer">Usuń</button>
        </div>
      `).join('');
    }

    async function saveWatchlist(commitMsg) {
      const token = localStorage.getItem('sentinel_gh_token');
      if (!token) {
        alert("Podaj najpierw GitHub Token (przycisk w prawym górnym rogu).");
        return false;
      }

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(watchlistData, null, 2))));
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/watchlist.json`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: commitMsg,
          content: contentBase64,
          sha: fileSha,
          branch: "main"
        })
      });

      if (!res.ok) {
        const err = await res.json();
        alert(`Błąd zapisu: ${err.message}`);
        return false;
      }
      const data = await res.json();
      fileSha = data.content.sha;
      renderTargets();
      return true;
    }

    async function addTarget() {
      const fSel = document.getElementById('selFrom');
      const tSel = document.getElementById('selTo');
      const dateVal = document.getElementById('selDate').value;
      const thresholdVal = parseInt(document.getElementById('selThreshold').value, 10);

      if (!fSel.value || !tSel.value) { alert("Wybierz przystanek odjazdu i przyjazdu!"); return; }
      if (!dateVal) { alert("Wybierz datę!"); return; }
      if (!selectedHours.size) { alert("Wybierz przynajmniej jedną godzinę!"); return; }

      const [yr, mo, da] = dateVal.split('-');
      const dPl = `${da}.${mo}.${yr}`;

      selectedHours.forEach(h => {
        watchlistData.targets.push({
          id: `${fSel.value}-${tSel.value}-${dateVal}-${h.replace(':', '')}`,
          from_id: fSel.value,
          from_name: fSel.options[fSel.selectedIndex].text,
          to_id: tSel.value,
          to_name: tSel.options[tSel.selectedIndex].text,
          date: dPl,
          hour: h,
          seat_threshold: thresholdVal || 5,
          baseline_price: 0.0,
          lowest_seen_price: 999.0,
          current_price: 0.0,
          last_seats: 70
        });
      });

      const ok = await saveWatchlist(`Watchlist: Dodano ${fSel.options[fSel.selectedIndex].text} -> ${tSel.options[tSel.selectedIndex].text} (${dPl})`);
      if (ok) {
        alert("Pomyślnie dodano do obserwowanych!");
        selectedHours.clear();
        renderHourSlots();
      }
    }

    async function removeTarget(idx) {
      if (!confirm("Czy na pewno usunąć tę obserwację?")) return;
      watchlistData.targets.splice(idx, 1);
      await saveWatchlist("Watchlist: Usunięto zadanie monitorowania");
    }

    initStationSelects();
    loadWatchlist();
  </script>
</body>
</html>
