  <script>
    const REPO_OWNER = "gkakol";
    const REPO_NAME = "Hermes";
    let fileSha = null;
    let watchlistData = { targets: [], archived_targets: [] };

    function swapStations() {
      const f = document.getElementById('selFrom').value;
      const t = document.getElementById('selTo').value;
      document.getElementById('selFrom').value = t;
      document.getElementById('selTo').value = f;
    }

    function configureToken() {
      const current = localStorage.getItem('sentinel_gh_token') || '';
      const token = prompt("Podaj GitHub Fine-Grained Personal Access Token (uprawnienia: Contents: Read & Write):", current);
      if (token !== null) {
        localStorage.setItem('sentinel_gh_token', token.trim());
        alert("Token zapisany pomyślnie w przeglądarce!");
        loadWatchlist();
      }
    }

    async function loadWatchlist() {
      const listEl = document.getElementById('targetsList');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/watchlist.json?ref=main`, {
          headers: localStorage.getItem('sentinel_gh_token') ? { 'Authorization': `token ${localStorage.getItem('sentinel_gh_token')}` } : {}
        });
        if (!res.ok) throw new Error("Błąd odczytu watchlist.json");
        const jsonRes = await res.json();
        fileSha = jsonRes.sha;
        watchlistData = JSON.parse(decodeURIComponent(escape(atob(jsonRes.content))));
        renderTargets();
      } catch (e) {
        listEl.innerHTML = `<div class="text-xs text-amber-500 py-4 text-center">Nie udało się pobrać pliku z GitHub API. Sprawdź token lub uprawnienia.</div>`;
      }
    }

    function renderTargets() {
      const listEl = document.getElementById('targetsList');
      document.getElementById('targetCount').innerText = `${watchlistData.targets.length} zadań`;

      if (!watchlistData.targets.length) {
        listEl.innerHTML = `<div class="text-xs text-slate-400 py-8 text-center">Brak aktywnych obserwacji. Skonfiguruj kurs po lewej stronie.</div>`;
        return;
      }

      listEl.innerHTML = watchlistData.targets.map((t, idx) => `
        <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
          <div>
            <div class="text-xs font-bold text-slate-800 dark:text-slate-200">${t.from_name} ➔ ${t.to_name}</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
              📅 <span class="font-bold text-slate-700 dark:text-slate-300">${t.date}</span> o <span class="font-mono font-bold">${t.hour}</span> • Alert miejsc: &le;${t.seat_threshold}
            </div>
            <div class="text-[10px] text-emerald-600 font-semibold mt-0.5">
              Ostatnia cena: ${t.current_price ? t.current_price.toFixed(2) + ' zł' : 'Oczekuje na skan'}
            </div>
          </div>
          <button onclick="removeTarget(${idx})" class="text-xs text-rose-500 hover:text-rose-700 font-bold px-2 py-1 rounded bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900">Usuń</button>
        </div>
      `).join('');
    }

    async function saveWatchlist(commitMsg) {
      const token = localStorage.getItem('sentinel_gh_token');
      if (!token) {
        alert("Aby zapisać zmiany w repozytorium, musisz podać GitHub Token (przycisk u góry).");
        return false;
      }

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(watchlistData, null, 2))));
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/watchlist.json`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: commitMsg,
          content: contentBase64,
          sha: fileSha,
          branch: "main"
        })
      });

      if (!res.ok) {
        const err = await res.json();
        alert(`Błąd zapisu na GitHubie: ${err.message}`);
        return false;
      }
      const data = await res.json();
      fileSha = data.content.sha;
      renderTargets();
      return true;
    }

    async function addTarget() {
      const fSel = document.getElementById('selFrom');
      const tSel = document.getElementById('selTo');
      const dateVal = document.getElementById('selDate').value;
      const hoursVal = document.getElementById('selHours').value;
      const thresholdVal = parseInt(document.getElementById('selThreshold').value, 10);

      if (!dateVal) { alert("Wybierz datę!"); return; }
      const [yr, mo, da] = dateVal.split('-');
      const dPl = `${da}.${mo}.${yr}`;

      const hours = hoursVal.split(',').map(h => h.trim()).filter(Boolean);
      if (!hours.length) { alert("Podaj przynajmniej jedną godzinę!"); return; }

      hours.forEach(h => {
        watchlistData.targets.push({
          id: `${fSel.value}-${tSel.value}-${dateVal}-${h.replace(':', '')}`,
          from_id: fSel.value,
          from_name: fSel.options[fSel.selectedIndex].text,
          to_id: tSel.value,
          to_name: tSel.options[tSel.selectedIndex].text,
          date: dPl,
          hour: h,
          seat_threshold: thresholdVal || 5,
          baseline_price: 0.0,
          lowest_seen_price: 999.0,
          current_price: 0.0,
          last_seats: 70
        });
      });

      const ok = await saveWatchlist(`Watchlist: Dodano ${fSel.options[fSel.selectedIndex].text} -> ${tSel.options[tSel.selectedIndex].text} (${dPl})`);
      if (ok) alert("Pomyślnie dodano do obserwowanych!");
    }

    async function removeTarget(idx) {
      if (!confirm("Czy na pewno usunąć tę obserwację?")) return;
      watchlistData.targets.splice(idx, 1);
      await saveWatchlist("Watchlist: Usunięto zadanie monitorowania");
    }

    // Ustaw dzisiejszą datę domyślnie
    document.getElementById('selDate').value = new Date().toISOString().split('T')[0];
    loadWatchlist();
  </script>
