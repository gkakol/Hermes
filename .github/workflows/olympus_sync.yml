name: Kosmiczny bus

on:
  schedule:
    # W ciągu dnia (06:00 - 22:00 UTC, czyli 08:00 - 00:00 czasu polskiego) -> co 40 minut
    - cron: '*/40 6-22 * * *'
    # W nocy (22:00 - 06:00 UTC) -> raz na 3 godziny
    - cron: '0 1,4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olympus-telemetry
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas seaborn

      - name: Uruchomienie skanera i analizatora zmian
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -u hermes_core.py

      - name: Generowanie heatmap obłożenia
        run: |
          python -u chronos_chart.py

      - name: Publikacja wyników w repozytorium
        run: |
          git config --global user.name "Hermes Agent"
          git config --global user.email "hermes-agent@users.noreply.github.com"
          git add -A
          git commit -m "Telemetry Sync: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git pull --rebase origin main
          git push
