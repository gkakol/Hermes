name: Sentinel N3 Telemetry Sync

on:
  #schedule:
    # W ciągu dnia (06:00 - 22:00 UTC, czyli 08:00 - 00:00 czasu polskiego) -> co 40 minut
    #- cron: '*/40 6-22 * * *'
    # W nocy (22:00 - 06:00 UTC) -> raz na 3 godziny
    #- cron: '0 1,4 * * *'
  workflow_dispatch:

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests urllib3 pandas matplotlib seaborn numpy

      - name: Run Sentinel Core
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u hermes_core.py

      - name: Generate Heatmaps
        run: python -u chronos_chart.py

      - name: Commit and Push telemetry data
        run: |
          git config --global user.name "hermes-agent"
          git config --global user.email "hermes@sentinel.internal"
          git add -A
          git commit -m "Telemetry Sync: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
