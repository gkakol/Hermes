name: Olympus Synchronization Protocol

on:
  schedule:
    - cron: '*/50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olympus-telemetry
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotowanie środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek analitycznych
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas seaborn

      - name: Wykonanie procedury Hermes Telemetry
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -u hermes_core.py

      - name: Generowanie map korytarza Chronos
        run: |
          python -u chronos_chart.py

      - name: Utrwalenie telemetrii w repozytorium
        run: |
          git config --global user.name "Hermes Automated Agent"
          git config --global user.email "hermes-agent@users.noreply.github.com"
          git add -A
          git commit -m "Telemetry Update: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git pull --rebase origin main
          git push
